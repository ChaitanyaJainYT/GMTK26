<!DOCTYPE html>
<html lang="en-us">
  <head>
      <meta charset="utf-8">
          <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
              <title>Unity Web Player | Count's Crypt</title>
                  <link rel="shortcut icon" href="TemplateData/favicon.ico">
                      <link rel="stylesheet" href="TemplateData/style.css">
                          <style>
                                /* Ensure unity container supports absolute overlay positioning in window and fullscreen */
                                      #unity-container {
                                              position: relative !important;
                                                    }

                                                          /* Floating Touch Controls Overlay on top of canvas */
                                                                #touch-controls-overlay {
                                                                        position: absolute;
                                                                                top: 0;
                                                                                        left: 0;
                                                                                                width: 100%;
                                                                                                        height: 100%;
                                                                                                                pointer-events: none;
                                                                                                                        z-index: 99999;
                                                                                                                                display: flex;
                                                                                                                                        flex-direction: column;
                                                                                                                                                justify-content: space-between;
                                                                                                                                                        padding: 16px;
                                                                                                                                                                box-sizing: border-box;
                                                                                                                                                                        user-select: none;
                                                                                                                                                                                -webkit-user-select: none;
                                                                                                                                                                                        touch-action: none;
                                                                                                                                                                                              }

                                                                                                                                                                                                    .touch-btn {
                                                                                                                                                                                                            pointer-events: auto;
                                                                                                                                                                                                                    background: rgba(15, 15, 25, 0.6);
                                                                                                                                                                                                                            color: #ffffff;
                                                                                                                                                                                                                                    border: 2px solid rgba(255, 255, 255, 0.6);
                                                                                                                                                                                                                                            border-radius: 50%;
                                                                                                                                                                                                                                                    width: 64px;
                                                                                                                                                                                                                                                            height: 64px;
                                                                                                                                                                                                                                                                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                                                                                                                                                                                                                                                                            font-weight: 700;
                                                                                                                                                                                                                                                                                    font-size: 18px;
                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                    align-items: center;
                                                                                                                                                                                                                                                                                                            justify-content: center;
                                                                                                                                                                                                                                                                                                                    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
                                                                                                                                                                                                                                                                                                                            touch-action: none;
                                                                                                                                                                                                                                                                                                                                    outline: none;
                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                    -webkit-tap-highlight-color: transparent;
                                                                                                                                                                                                                                                                                                                                                            backdrop-filter: blur(4px);
                                                                                                                                                                                                                                                                                                                                                                    -webkit-backdrop-filter: blur(4px);
                                                                                                                                                                                                                                                                                                                                                                            transition: transform 0.05s ease, background-color 0.05s ease;
                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                        .touch-btn:active, .touch-btn.active {
                                                                                                                                                                                                                                                                                                                                                                                                background: rgba(255, 255, 255, 0.5);
                                                                                                                                                                                                                                                                                                                                                                                                        border-color: #ffffff;
                                                                                                                                                                                                                                                                                                                                                                                                                transform: scale(0.92);
                                                                                                                                                                                                                                                                                                                                                                                                                        color: #000;
                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                    .touch-btn-rect {
                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    width: auto;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 0 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    height: 48px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    letter-spacing: 0.5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .touch-top-bar {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .touch-bottom-bar {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            align-items: flex-end;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .touch-dpad {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                gap: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="unity-container" class="unity-desktop">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Floating Touch Controls Overlay -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="touch-controls-overlay">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="touch-top-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="touch-btn touch-btn-rect" data-key="Escape" data-code="Escape" data-keycode="27">ESC</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="touch-btn touch-btn-rect" data-key="r" data-code="KeyR" data-keycode="82">RESTART (R)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="touch-bottom-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="touch-dpad">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="touch-btn" data-key="a" data-code="KeyA" data-keycode="65">◄</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="touch-btn" data-key="d" data-code="KeyD" data-keycode="68">►</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="touch-btn touch-btn-rect" style="width: 110px; height: 64px; font-size: 16px; font-weight: bold;" data-key=" " data-code="Space" data-keycode="32">JUMP</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="unity-loading-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="unity-logo"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="unity-progress-bar-empty">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="unity-progress-bar-full"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="unity-warning"> </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="unity-footer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="unity-logo-title-footer"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="unity-fullscreen-button"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="unity-build-title">Count's Crypt</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                var canvas = document.querySelector("#unity-canvas");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Shows a temporary message banner/ribbon for a few seconds, or
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // a permanent error message on top of the canvas if type=='error'.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // If type=='warning', a yellow highlight color is used.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Modify or remove this function to customize the visually presented
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // way that non-critical warnings and error messages are presented to the
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // user.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function unityShowBanner(msg, type) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  var warningBanner = document.querySelector("#unity-warning");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function updateBannerVisibility() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    var div = document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            div.innerHTML = msg;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    warningBanner.appendChild(div);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (type == 'error') div.style = 'background: red; padding: 10px;';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        setTimeout(function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    warningBanner.removeChild(div);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                updateBannerVisibility();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }, 5000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          updateBannerVisibility();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      var buildUrl = "Build";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            var loaderUrl = buildUrl + "/BuildWeb.loader.js";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  var config = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          arguments: [],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  dataUrl: buildUrl + "/BuildWeb.data",
